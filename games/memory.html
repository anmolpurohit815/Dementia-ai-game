<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindCare - Memory Match</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <div class="container">

        <h1>🧠 MindCare</h1>

        <h2>🃏 Memory Match</h2>

        <p>
            Find and match the same cards.
        </p>


        <!-- Difficulty -->

        <div class="difficulty-section">

            <label for="difficulty">
                Select Difficulty
            </label>

            <select id="difficulty">

                <option value="easy">
                    Easy
                </option>

                <option value="medium">
                    Medium
                </option>

                <option value="hard">
                    Hard
                </option>

            </select>

        </div>


        <!-- Game Information -->

        <div class="game-info">

            <div>

                <strong>Score</strong>

                <span id="score">
                    0
                </span>

            </div>


            <div>

                <strong>Mistakes</strong>

                <span id="mistakes">
                    0
                </span>

            </div>


            <div>

                <strong>Accuracy</strong>

                <span id="accuracy">
                    0%
                </span>

            </div>


            <div>

                <strong>Time</strong>

                <span id="timer">
                    0
                </span>

                <small>
                    seconds
                </small>

            </div>

        </div>


        <!-- Round -->

        <h3 id="roundDisplay">
            Round 0 / 10
        </h3>


        <!-- Cards -->

        <div id="gameBoard">
        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button id="startBtn">
                Start Game
            </button>

            <button id="restartBtn">
                Restart Game
            </button>

        </div>


        <!-- Back Home -->

        <div class="buttons">

            <button
                onclick="window.location.href='../index.html'">

                🏠 Back to Home

            </button>

        </div>

    </div>


    <script src="memory.js"></script>

</body>

</html>
